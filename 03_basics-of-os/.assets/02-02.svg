<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Apps, Operating System, and Processor with 2 Cores</title>
  <desc id="desc">A clean diagram inspired by the reference: Excel, Word and Visual Studio Code on the left, an operating system in the center, and a one-core processor on the right.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".22"/>
    </filter>

    <pattern id="diagHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#8b5f66" stroke-opacity=".28" stroke-width="3"/>
    </pattern>

    <style>
      :root {
        --ink: #24292f;
        --muted: #57606a;
        --panel: #ffffff;
        --panel-dark: #161b22;
      }

      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 500; letter-spacing: .2px; }
      .title { font-size: 28px; }
      .small { font-size: 18px; }

      @media (prefers-color-scheme: dark) {
        .label { fill: #f0f6fc; }
        .subtle { fill: #c9d1d9; }
        .processor-outline { stroke: #c9d1d9; }
        .chip-outline { stroke: #c9d1d9; }
      }

      @media (prefers-color-scheme: light) {
        .label { fill: #24292f; }
        .subtle { fill: #57606a; }
        .processor-outline { stroke: #57606a; }
        .chip-outline { stroke: #24292f; }
      }
    </style>
  </defs>

  <!-- Excel -->
  <g transform="translate(52 48)">
    <rect x="16" y="0" width="68" height="20" rx="5" fill="#107c41"/>
    <rect x="28" y="14" width="68" height="72" rx="7" fill="#21a366"/>
    <rect x="0" y="24" width="58" height="58" rx="12" fill="#1f8f57" stroke="#d7f2e5" stroke-width="2"/>
    <path d="M19 39 L42 67 M42 39 L19 67" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <g opacity=".8" stroke="#d9f2e2" stroke-width="2">
      <path d="M58 28h30M58 45h30M58 62h30M58 79h30"/>
      <path d="M72 24v58M87 24v58"/>
    </g>
  </g>

  <!-- Word -->
  <g transform="translate(52 190)">
    <rect x="16" y="0" width="68" height="20" rx="5" fill="#185abd"/>
    <rect x="28" y="14" width="68" height="72" rx="7" fill="#2b7cd3"/>
    <rect x="0" y="24" width="58" height="58" rx="12" fill="#4b9be8" stroke="#dbeafe" stroke-width="2"/>
    <text x="29" y="66" text-anchor="middle" class="label" fill="#fff" font-size="35" font-weight="700">W</text>
    <g opacity=".85" stroke="#d8ebff" stroke-width="2">
      <path d="M58 28h30M58 45h30M58 62h30M58 79h30"/>
      <path d="M72 24v58M87 24v58"/>
    </g>
  </g>

  <!-- VS Code -->
  <g transform="translate(50 325)">
    <path d="M20 18 L74 0 L96 16 L96 84 L74 100 L20 82 L0 61 L18 49 L3 34 Z"
          fill="#007acc"/>
    <path d="M25 18 L68 39 L25 82 L9 68 L35 49 L9 30 Z" fill="#1f9cf0"/>
    <path d="M35 49 L69 23 L69 76 Z" fill="#005a9e" opacity=".95"/>
  </g>

  <!-- Labels under apps -->
  <text x="108" y="472" class="label title" text-anchor="middle">Apps</text>

  <!-- OS icon -->
  <g transform="translate(344 160)" filter="url(#shadow)">
    <rect x="0" y="0" width="62" height="62" fill="#f45151"/>
    <rect x="74" y="0" width="62" height="62" fill="#178b2b"/>
    <rect x="0" y="74" width="62" height="62" fill="#667eea"/>
    <rect x="74" y="74" width="62" height="62" fill="#a76a06"/>
  </g>
  <text x="412" y="330" class="label" text-anchor="middle" font-size="34">OS</text>

  <!-- Processor -->
  <g transform="translate(740 42)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="360" rx="34"
          fill="#12161c" fill-opacity=".9" class="processor-outline" stroke-width="2.5"/>
    <rect x="8" y="8" width="344" height="344" rx="28"
          fill="url(#diagHatch)" opacity=".72"/>

    <!-- two cores / chip -->
    <g transform="translate(129 116)">
      <!-- package -->
      <rect x="0" y="0" width="102" height="82" rx="7" fill="#1f2329" class="chip-outline" stroke-width="2"/>
      <!-- two core dies -->
      <rect x="12" y="12" width="34" height="58" rx="4" fill="none" class="chip-outline" stroke-width="1.6"/>
      <rect x="56" y="12" width="34" height="58" rx="4" fill="none" class="chip-outline" stroke-width="1.6"/>
      <text x="29" y="45" text-anchor="middle" class="label subtle" font-size="13">1</text>
      <text x="73" y="45" text-anchor="middle" class="label subtle" font-size="13">2</text>
      <!-- package pins -->
      <g class="chip-outline" stroke-width="1.8">
        <path d="M10 -10 V0 M25 -10 V0 M40 -10 V0 M55 -10 V0 M70 -10 V0 M85 -10 V0"/>
        <path d="M10 82 V92 M25 82 V92 M40 82 V92 M55 82 V92 M70 82 V92 M85 82 V92"/>
        <path d="M-10 10 H0 M-10 28 H0 M-10 46 H0 M-10 64 H0"/>
        <path d="M102 10 H112 M102 28 H112 M102 46 H112 M102 64 H112"/>
      </g>
    </g>
  </g>

  <text x="920" y="478" class="label title" text-anchor="middle">Processor with 2 Cores</text>
</svg>
